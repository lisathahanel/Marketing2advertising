<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Opening Marketing2Advertising...</title>
</head>
<body>
  <p id="fallback-message">Opening the requested page...</p>
  <script>
    (function () {
      var path = window.location.pathname || "/";
      if (path === "/firimu" || path.indexOf("/firimu/") === 0) {
        // GitHub Pages has no per-folder SPA rewrite. Load the Firimu app shell
        // while preserving the requested URL so BrowserRouter can render it.
        fetch("/firimu/index.html", { cache: "no-store" })
          .then(function (response) {
            if (!response.ok) throw new Error("Firimu app entry unavailable");
            return response.text();
          })
          .then(function (html) {
            document.open();
            document.write(html);
            document.close();
          })
          .catch(function () {
            window.location.replace("/firimu/");
          });
        return;
      }
      window.location.replace("/");
    })();
  </script>
</body>
</html>
