        fetch('https://www.marketing2advertising.com/feeds/posts/default?alt=rss&max-results=10')
        .then(response => response.text())
        .then(data => {
            let parser = new DOMParser();
            let xml = parser.parseFromString(data, "text/xml");
            let entries = xml.getElementsByTagName("entry");

            let output = "";
            for (let i = 0; i < entries.length; i++) {
                let title = entries[i].getElementsByTagName("title")[0].textContent;
                let link = entries[i].getElementsByTagName("link")[0].getAttribute("href");
                output += `<li><a href="${link}" target="_blank">${title}</a></li>`;
            }
            document.getElementById("rss-container").innerHTML = output;
        })
        .catch(error => console.error("Error fetching RSS feed:", error));
