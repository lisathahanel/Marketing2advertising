name: Marketing2Advertising Android APK

on:
  push:
    branches: [main]
    paths:
      - 'flutter_project/**'
      - '.github/workflows/m2a-mobile.yml'
  pull_request:
    paths:
      - 'flutter_project/**'
      - '.github/workflows/m2a-mobile.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    name: Analyze, test and build Android APKs
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: flutter_project
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Show Flutter version
        run: flutter --version
      - name: Generate Android runner scaffold
        run: flutter create --platforms=android --org com.marketing2advertising --project-name marketing2advertising_mobile .
      - name: Install dependencies
        run: flutter pub get
      - name: Analyze
        run: flutter analyze
      - name: Test
        run: flutter test
      - name: Build installable debug APK
        run: flutter build apk --debug
      - name: Build release APK
        run: flutter build apk --release
      - name: Generate APK SHA-256 checksums
        run: |
          cd build/app/outputs/flutter-apk
          sha256sum app-debug.apk app-release.apk > SHA256SUMS.txt
      - name: Upload verified APKs and checksums
        uses: actions/upload-artifact@v4
        with:
          name: marketing2advertising-android-apks
          path: |
            flutter_project/build/app/outputs/flutter-apk/app-debug.apk
            flutter_project/build/app/outputs/flutter-apk/app-release.apk
            flutter_project/build/app/outputs/flutter-apk/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30

  ios:
    name: iOS simulator build (unsigned)
    runs-on: macos-latest
    defaults:
      run:
        working-directory: flutter_project
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate iOS runner scaffold
        run: flutter create --platforms=ios --org com.marketing2advertising .
      - name: Install dependencies
        run: flutter pub get
      - name: Analyze
        run: flutter analyze
      - name: Build iOS without signing
        run: flutter build ios --no-codesign
