name: Deploy M2A to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Build production app
        env:
          VITE_ONESIGNAL_APP_ID: ${{ secrets.VITE_ONESIGNAL_APP_ID }}
          VITE_EMAIL_API_BASE: https://m2a-emailextractor.ai.studio
        run: bun run build

      - name: Verify production entry and bundles
        run: |
          test -s dist/index.html
          test -d dist/assets
          grep -q 'src="./assets/' dist/index.html
          grep -q 'href="./assets/' dist/index.html
          find dist/assets -maxdepth 1 -type f -print
          echo "Production HTML and bundled assets verified."

      - name: Restore existing static website pages and posts
        run: |
          set -eu
          for dir in 2010 2015 2020 2022 2023 2024 2025 2026 2027 ad apps blogs firimu game games p postad serie tv; do
            if [ -d "$dir" ]; then
              cp -a "$dir" dist/
            fi
          done
          for file in 404.html ads.txt robots.txt sitemap.xml; do
            if [ -f "$file" ]; then
              cp -f "$file" dist/
            fi
          done
          test -s dist/index.html
          test -s dist/tv/index.html
          test -s dist/games/index.html
          test -s dist/serie/index.html
          test -s dist/firimu/index.html
          test -d dist/p
          echo "Existing website folders, posts, and static pages restored."

      - name: Publish standalone Email Extractor page
        run: |
          set -eu
          node --input-type=module <<'NODE'
          import { readFileSync, writeFileSync, existsSync } from 'node:fs';
          const source = readFileSync('dist/index.html', 'utf8');
          if (!source.includes('./assets/')) {
            throw new Error('Built index.html does not reference relative production assets.');
          }
          const title = '<title>Email Extractor &amp; Campaign Tools | Marketing2Advertising</title>';
          const page = source.replace(/<title>[^<]*<\/title>/i, title);
          if (page === source || !page.includes(title)) {
            throw new Error('Could not set the standalone Email Extractor page title.');
          }
          writeFileSync('dist/m2a-emailextractor.html', page);
          NODE
          test -s dist/m2a-emailextractor.html
          grep -Fq '<title>Email Extractor &amp; Campaign Tools | Marketing2Advertising</title>' dist/m2a-emailextractor.html
          grep -Eq '<script[^>]+type="module"[^>]+src="./assets/[^"]+"' dist/m2a-emailextractor.html
          grep -Eq '<link[^>]+href="./assets/[^"]+\.css"' dist/m2a-emailextractor.html
          echo "Standalone Email Extractor HTML, title, JS and CSS entrypoints verified."

      - name: Preserve custom domain
        run: |
          test -s CNAME
          cp CNAME dist/CNAME

      - name: Disable Jekyll processing
        run: touch dist/.nojekyll

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
