name: Deploy M2A to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Build production app
        env:
          VITE_ONESIGNAL_APP_ID: ${{ secrets.VITE_ONESIGNAL_APP_ID }}
          VITE_EMAIL_API_BASE: https://m2a-emailextractor.ai.studio
        run: bun run build

      - name: Verify production entry and bundles
        run: |
          test -s dist/index.html
          test -d dist/assets
          grep -q 'src="https://marketing2advertising.com/assets/' dist/index.html
          grep -q 'href="https://marketing2advertising.com/assets/' dist/index.html
          test -s dist/assets/m2a-embed.js
          test -s dist/assets/m2a-embed.css
          find dist/assets -maxdepth 1 -type f -print
          echo "Production HTML and bundled assets verified."

      - name: Restore existing static website pages and posts
        run: |
          set -eu
          for dir in 2010 2015 2020 2022 2023 2024 2025 2026 2027 ad apps blogs game games jobs p postad serie tv; do
            if [ -d "$dir" ]; then
              cp -a "$dir" dist/
            fi
          done
          for file in 404.html ads.txt robots.txt sitemap.xml; do
            if [ -f "$file" ]; then
              cp -f "$file" dist/
            fi
          done
          test -s dist/index.html
          test -s dist/tv/index.html
          test -s dist/games/index.html
          test -s dist/serie/index.html
          test -d dist/p
          echo "Existing website folders, posts, and static pages restored."

      - name: Copy the existing Live TV app into Firimu
        run: |
          set -eu
          mkdir -p firimu/public/tv
          cp -a tv/. firimu/public/tv/
          test -s firimu/public/tv/index.html
          test -s firimu/public/tv/citizentv.html
          echo "Standalone /tv/ and Firimu /firimu/tv/ will both be published."

      - name: Build and publish the new Firimu application
        run: |
          set -eu
          cd firimu
          bun install --frozen-lockfile
          bun run build
          cd ..
          test -s firimu/dist/index.html
          mkdir -p dist/firimu
          cp -a firimu/dist/. dist/firimu/
          test -s dist/firimu/index.html
          grep -Eq 'src="/firimu/assets/[^"]+\.js"' dist/firimu/index.html
          grep -Eq 'href="/firimu/assets/[^"]+\.css"' dist/firimu/index.html
          test -s dist/firimu/manifest.webmanifest
          echo "Firimu React app built and published under /firimu/."

      - name: Publish independent Email Extractor app
        run: |
          set -eu
          test -s dist/m2a-emailextractor/index.html
          grep -Fq '<title>Email Extractor &amp; Address Validator — Free Online Email Tools</title>' dist/m2a-emailextractor/index.html
          grep -Fq 'id="root"' dist/m2a-emailextractor/index.html
          grep -Eq '<script[^>]+type="module"[^>]+src="[^"]+\.js"' dist/m2a-emailextractor/index.html
          grep -Eq '<link[^>]+href="[^"]+\.css"' dist/m2a-emailextractor/index.html
          mkdir -p dist/m2a-emailextractor
          cp m2a-emailextractor/public/favicon.ico dist/m2a-emailextractor/favicon.ico
          cat > dist/m2a-emailextractor.html <<'EOF'
          <!doctype html>
          <html lang="en">
            <head>
              <meta charset="utf-8">
              <meta name="viewport" content="width=device-width, initial-scale=1">
              <meta http-equiv="refresh" content="0;url=/m2a-emailextractor/">
              <link rel="canonical" href="https://marketing2advertising.com/m2a-emailextractor/">
              <title>Email Extractor — Marketing2Advertising</title>
              <script>window.location.replace('/m2a-emailextractor/');</script>
            </head>
            <body>
              <p>Opening the <a href="/m2a-emailextractor/">Marketing2Advertising Email Extractor</a>…</p>
            </body>
          </html>
          EOF
          test -s dist/m2a-emailextractor.html
          echo "Complete independent Email Extractor app and legacy entry URL verified."

      - name: Publish direct-load Email Extractor tool routes
        run: |
          set -eu
          for route in extractor pdf-jpg-extractor validator formatter domains sender; do
            mkdir -p "dist/m2a-emailextractor/$route"
            sed -E 's#(src|href)="([^"]*/)?assets/#\1="/assets/#g' \
              dist/m2a-emailextractor/index.html > "dist/m2a-emailextractor/$route/index.html"
            test -s "dist/m2a-emailextractor/$route/index.html"
            grep -Eq 'src="/assets/[^"]+\.js"' "dist/m2a-emailextractor/$route/index.html"
            grep -Eq 'href="/assets/[^"]+\.css"' "dist/m2a-emailextractor/$route/index.html"
          done
          echo "All Email Extractor tool routes have direct-load entry pages and root-relative compiled assets."

      - name: Publish independent M2A Bot app
        run: |
          set -eu
          test -s m2abot-main/index.html
          test -s m2abot-main/favicon.ico
          mkdir -p dist/m2abot-main
          cp m2abot-main/index.html dist/m2abot-main/index.html
          cp m2abot-main/favicon.ico dist/m2abot-main/favicon.ico
          for route in terminal indicators how-it-works disclaimer; do
            mkdir -p "dist/m2abot-main/$route"
            cp m2abot-main/index.html "dist/m2abot-main/$route/index.html"
          done
          grep -Fq '<title>M2A Bot — Forex &amp; Crypto Signal Bot</title>' dist/m2abot-main/index.html
          grep -Fq '/m2abot-main/terminal' dist/m2abot-main/index.html
          echo "Independent M2A Bot app and nested routes published."

      - name: Build and overlay the new M2A homepage
        working-directory: tttt3333-main
        run: |
          set -eu
          bun install --frozen-lockfile
          bun run lint
          bun run build
          test -s dist/index.html
          test -d dist/assets
          test -s dist/manifest.webmanifest
          test -s dist/sw.js
          cd ..
          for asset in tttt3333-main/dist/assets/*; do
            test -f "$asset" || continue
            target="dist/assets/$(basename "$asset")"
            if [ -e "$target" ]; then
              echo "Asset filename collision: $target"
              exit 1
            fi
          done
          cp -a tttt3333-main/dist/assets/. dist/assets/
          if [ -d tttt3333-main/dist/src ]; then
            mkdir -p dist/src
            while IFS= read -r -d '' asset; do
              rel="${asset#tttt3333-main/dist/src/}"
              if [ -e "dist/src/$rel" ]; then
                echo "Source asset filename collision: dist/src/$rel"
                exit 1
              fi
            done < <(find tttt3333-main/dist/src -type f -print0)
            cp -a tttt3333-main/dist/src/. dist/src/
          fi
          cp -f tttt3333-main/dist/index.html dist/index.html
          for file in sw.js manifest.webmanifest icon.svg apple-touch-icon.png pwa-192x192.png pwa-512x512.png pwa-maskable-512x512.png; do
            if [ -f "tttt3333-main/dist/$file" ]; then
              cp -f "tttt3333-main/dist/$file" "dist/$file"
            fi
          done
          grep -Eq 'src="/assets/[^"]+\.js"' dist/index.html
          grep -Eq 'href="/assets/[^"]+\.css"' dist/index.html
          test -s dist/tv/index.html
          test -s dist/firimu/index.html
          test -s dist/games/index.html
          test -s dist/m2abot-main/index.html
          test -s dist/m2a-emailextractor/index.html
          test -s dist/CNAME || test -s CNAME
          echo "New homepage overlaid; existing site routes and assets remain in the Pages output."

      - name: Preserve custom domain
        run: |
          test -s CNAME
          cp CNAME dist/CNAME

      - name: Disable Jekyll processing
        run: touch dist/.nojekyll

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy-api-worker:
    runs-on: ubuntu-latest
    needs: build
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: "879c411e964cea0a85b8a94d0ef94b7b"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install homepage Worker dependencies
        working-directory: tttt3333-main
        run: bun install --frozen-lockfile

      - name: Build Worker assets
        working-directory: tttt3333-main
        run: bun run build

      - name: Deploy homepage API Worker routes
        if: env.CLOUDFLARE_API_TOKEN != ''
        working-directory: tttt3333-main
        run: bunx wrangler deploy --config wrangler.production.jsonc

      - name: Require Cloudflare deployment credentials
        if: env.CLOUDFLARE_API_TOKEN == ''
        run: |
          echo "::error::CLOUDFLARE_API_TOKEN is required before production Pages can be deployed."
          exit 1

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: [build, deploy-api-worker]
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
