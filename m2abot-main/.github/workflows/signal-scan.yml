name: M2A Bot 24/7 Signal & Paper-Trade Scanner

on:
  schedule:
    # Runs every hour at minute 5 (free on public GitHub repositories)
    - cron: "5 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scan-markets:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: m2abot-main/bot/requirements.txt

      - name: Install bot dependencies
        run: pip install -r m2abot-main/bot/requirements.txt

      - name: Run single all-market scan (--once)
        env:
          MODE: ${{ secrets.BOT_MODE || 'paper' }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          BINANCE_API_KEY: ${{ secrets.BINANCE_API_KEY }}
          BINANCE_API_SECRET: ${{ secrets.BINANCE_API_SECRET }}
          CRYPTO_PAIRS: "BTCUSDT,ETHUSDT,SOLUSDT,XRPUSDT"
          FOREX_PAIRS: "EURUSD,GBPUSD,USDJPY,XAUUSD"
          TIMEFRAMES: "15m,1H,4H"
          MIN_SIGNAL_SCORE: "2"
        run: python m2abot-main/bot/bot.py --once

      - name: Persist updated bot state & paper trades
        run: |
          git config user.name "M2A Bot Bot"
          git config user.email "actions@users.noreply.github.com"
          git add -f m2abot-main/bot/state.json m2abot-main/bot/trades.csv m2abot-main/bot/latest_signals.json 2>/dev/null || true
          if ! git diff --cached --quiet; then
            git commit -m "chore(bot): update scan state and paper trades"
            git push
          fi
