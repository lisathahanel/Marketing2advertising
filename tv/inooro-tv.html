.m2a-overlay{position:absolute;inset:0;z-index:20;display:flex;flex-direction:column;align-items:center;justify-content:center;background:rgba(0,0,0,.55);gap:12px;transition:opacity .2s}

.m2a-play-btn::after{content:"";border-top:16px solid transparent;border-bottom:16px solid transparent;border-left:26px solid #fff;margin-left:5px}
.m2a-hint{color:#fff;font-size:13px;font-weight:700;background:rgba(0,0,0,.5);padding:6px 12px;border-radius:8px}
.m2a-loader-spin{width:44px;height:44px;border:4px solid rgba(255,255,255,.12);border-top-color:#e11d48;border-radius:50%;animation:spin .7s linear infinite}

@keyframes pulse{0%,100%{opacity:1}50%{opacity:.65}}
@keyframes spin{to{transform:rotate(360deg)}}
.m2a-ch-name{position:absolute;bottom:12px;left:12px;z-index:25;background:rgba(0,0,0,.75);color:#fff;font-size:13px;font-weight:700;padding:6px 11px;border-radius:8px;max-width:70%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

.ch-badge{position:absolute;left:6px;top:6px;background:#e11d48;color:#fff;font-size:9px;font-weight:900;padding:2px 6px;border-radius:4px}
.ch-info{padding:8px}
.ch-title{font-size:12px;font-weight:800;color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

.m2a-footer{margin-top:28px;border-top:1px solid rgba(255,255,255,.06);background:#0a0a0d;text-align:center;padding:16px 14px;font-size:12px;color:#a0a0b0}

@media(max-width:700px){
  .m2a-player-wrap{border-radius:0;margin-left:-12px;margin-right:-12px;width:calc(100% + 24px)}
  .m2a-play-btn{width:70px;height:70px}
  .ch-grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
  #m2a-app{padding-left:10px;padding-right:10px}
}

<script>
(function(){
"use strict";
var STREAM_URL = "https://inooro-tv.co.ug/live/ch04/index.m3u8";
var CHANNEL_NAME = "Inooro TV";
var CHANNEL_ID = "inooro-tv";
var ALL_CHANNELS = [{"id":"citizentv","name":"Citizen TV","category":"News","color":"e11d48"},{"id":"salttv","name":"Salt TV","category":"Entertainment","color":"f59e0b"},{"id":"sparktv","name":"Spark TV","category":"Entertainment","color":"8b5cf6"},{"id":"bukedde1","name":"Bukedde 1 TV","category":"News","color":"22c55e"},{"id":"ntv","name":"NTV Uganda","category":"News","color":"3b82f6"},{"id":"galaxytv","name":"Galaxy TV","category":"Entertainment","color":"ec4899"},{"id":"bukedde2","name":"Bukedde 2 TV","category":"Entertainment","color":"14b8a6"},{"id":"sabcnews","name":"SABC News","category":"News","color":"ef4444"},{"id":"capetowntv","name":"Cape Town TV","category":"Community","color":"f97316"},{"id":"tshwanetv","name":"Tshwane TV","category":"Community","color":"a855f7"},{"id":"sowetotv","name":"Soweto TV","category":"Community","color":"06b6d4"},{"id":"nrgradio","name":"NRG Radio UG","category":"Entertainment","color":"84cc16"},{"id":"babatv","name":"Baba TV","category":"Entertainment","color":"f43f5e"},{"id":"sudantv","name":"Sudan TV","category":"News","color":"eab308"},{"id":"france24","name":"France 24","category":"News","color":"2563eb"},{"id":"fifaplus","name":"FIFA+","category":"Sports","color":"16a34a"},{"id":"dw","name":"DW","category":"News","color":"0ea5e9"},{"id":"ewtn","name":"EWTN","category":"Faith","color":"7c3aed"},{"id":"ebstv","name":"EBS TV Ethiopia","category":"News","color":"d946ef"},{"id":"yadah-tv","name":"Yadah TV","category":"Faith","color":"d8a31a"},{"id":"wildearth","name":"WildEarth","category":"Entertainment","color":"16a34a"},{"id":"boktv","name":"BOKTV","category":"Entertainment","color":"0ea5e9"},{"id":"sabc2","name":"SABC 2","category":"Entertainment","color":"f59e0b"},{"id":"sabc1","name":"SABC 1","category":"Entertainment","color":"2563eb"},{"id":"redemption-tv-ministry","name":"Redemption Television Ministry","category":"Faith","color":"7c3aed"},{"id":"faith-africa","name":"Faith Africa","category":"Faith","color":"a855f7"},{"id":"sportscast-africa","name":"SportsCast Africa","category":"Sports","color":"16a34a"},{"id":"k24tv","name":"K24TV","category":"News","color":"dc7c22"},{"id":"inooro-tv","name":"Inooro TV","category":"Entertainment","color":"e11d48"},{"id":"morning-cloud-tv","name":"Morning Cloud TV","category":"Faith","color":"38bdf8"},{"id":"bbs-tv","name":"BBS TV","category":"News","color":"f97316"},{"id":"cinewestern","name":"CineWestern","category":"Entertainment","color":"b45309"},{"id":"goldmines-movies","name":"Goldmines Movies","category":"Entertainment","color":"ca8a04"}];

window.m2aLoadHls = function(cb){
  if(window.Hls){ cb(); return; }
  if(window.__m2aHlsLoading){
    window.__m2aHlsCallbacks = window.__m2aHlsCallbacks || [];
    window.__m2aHlsCallbacks.push(cb);
    return;
  }
  window.__m2aHlsLoading = true;
  window.__m2aHlsCallbacks = [cb];
  var s = document.createElement("script");
  s.src = "https://cdn.jsdelivr.net/npm/hls.js@1.5.7/dist/hls.min.js";
  s.async = true;
  function done(){
    var cbs = window.__m2aHlsCallbacks || [];
    window.__m2aHlsCallbacks = [];
    cbs.forEach(function(fn){ try{ fn(); }catch(e){} });
  }
  s.onload = done;
  s.onerror = done;
  document.head.appendChild(s);
};

function pushAds(){
  document.querySelectorAll("ins.adsbygoogle:not([data-m2a-loaded]):not([data-adsbygoogle-status])").forEach(function(ad){
    if(ad.getBoundingClientRect().width < 10) return;
    ad.setAttribute("data-m2a-loaded","1");
    try{ (window.adsbygoogle = window.adsbygoogle || []).push({}); }catch(e){ ad.removeAttribute("data-m2a-loaded"); }
  });
}
if("requestAnimationFrame" in window){
  requestAnimationFrame(function(){ setTimeout(pushAds, 300); });
} else {
  setTimeout(pushAds, 500);
}

var videoEl = document.getElementById("m2aVideo");
var playOverlay = document.getElementById("m2aPlayOverlay");
var loadOverlay = document.getElementById("m2aLoadOverlay");
var errorOverlay = document.getElementById("m2aErrorOverlay");
var loadText = document.getElementById("m2aLoadText");
var playBtn = document.getElementById("m2aPlayBtn");
var retryBtn = document.getElementById("m2aRetryBtn");
var currentHls = null, loadTimer = null, playing = false;

function showOnly(w){
  if(playOverlay) playOverlay.classList.toggle("hidden", w !== "play");
  if(loadOverlay) loadOverlay.classList.toggle("hidden", w !== "load");
  if(errorOverlay) errorOverlay.classList.toggle("hidden", w !== "error");
}
function showLoading(m){
  if(loadText) loadText.textContent = m || "Connecting…";
  showOnly("load");
}
function showError(){
  destroyHls();
  playing = false;
  showOnly("error");
}
function destroyHls(){
  if(currentHls){ try{ currentHls.destroy(); }catch(e){} currentHls = null; }
  if(loadTimer){ clearTimeout(loadTimer); loadTimer = null; }
}
function attachStream(url, autoPlay){
  destroyHls();
  if(!videoEl) return;
  videoEl.removeAttribute("src");
  try{ videoEl.load(); }catch(e){}
  var done = false;
  function onReady(){
    if(done) return;
    done = true;
    if(loadTimer){ clearTimeout(loadTimer); loadTimer = null; }
    if(autoPlay){
      videoEl.play().then(function(){ playing = true; showOnly("none"); }).catch(function(){ playing = false; showOnly("play"); });
    }
  }
  loadTimer = setTimeout(function(){ if(!done) showError(); }, 18000);
  function attachNative(){
    videoEl.src = url;
    videoEl.addEventListener("loadedmetadata", onReady, {once:true});
    videoEl.addEventListener("error", function(){ if(!done) showError(); }, {once:true});
  }
  if(/\.m3u8(\?|$)/i.test(url)){
    m2aLoadHls(function(){
      if(window.Hls && Hls.isSupported()){
        currentHls = new Hls({
          enableWorker:true, lowLatencyMode:true,
          backBufferLength:60, maxBufferLength:30,
          manifestLoadingTimeOut:12000, fragLoadingTimeOut:15000
        });
        currentHls.loadSource(url);
        currentHls.attachMedia(videoEl);
        currentHls.on(Hls.Events.MANIFEST_PARSED, onReady);
        currentHls.on(Hls.Events.ERROR, function(ev, data){
          if(!data.fatal) return;
          if(data.type === Hls.ErrorTypes.NETWORK_ERROR){ try{ currentHls.startLoad(); }catch(e){ showError(); } }
          else if(data.type === Hls.ErrorTypes.MEDIA_ERROR){ try{ currentHls.recoverMediaError(); }catch(e){ showError(); } }
          else showError();
        });
      } else attachNative();
    });
  } else attachNative();
}
function startPlay(){
  showLoading("Connecting to " + CHANNEL_NAME + "…");
  attachStream(STREAM_URL, true);
}

if(playBtn) playBtn.addEventListener("click", function(e){ e.preventDefault(); e.stopPropagation(); startPlay(); });
if(playOverlay) playOverlay.addEventListener("click", function(e){
  if(e.target === playOverlay || e.target.classList.contains("m2a-hint")){ e.preventDefault(); startPlay(); }
});
if(retryBtn) retryBtn.addEventListener("click", function(e){ e.preventDefault(); startPlay(); });
if(videoEl){
  videoEl.addEventListener("playing", function(){ playing = true; showOnly("none"); });
  videoEl.addEventListener("waiting", function(){ if(playing) showLoading("Buffering…"); });
  videoEl.addEventListener("canplay", function(){ if(playing) showOnly("none"); });
}

/* Other channels grid */
var grid = document.getElementById("chGrid");
if(grid){
  var html = "";
  ALL_CHANNELS.forEach(function(ch){
    var active = ch.id === CHANNEL_ID;
    var thumb = "https://via.placeholder.com/400x225/" + ch.color + "/ffffff?text=" + encodeURIComponent(ch.name);
    html += '<a class="ch-card' + (active ? " active" : "") + '" href="' + ch.id + '.html">' +
      '<div class="ch-poster"><img src="' + thumb + '" alt="' + ch.name + '" loading="lazy" width="400" height="225">' +
      '<span class="ch-badge">LIVE</span></div>' +
      '<div class="ch-info"><div class="ch-title">' + ch.name + '</div><div class="ch-meta">' + ch.category + '</div></div></a>';
  });
  grid.innerHTML = html;
}

/* Auto-start after short delay (browser may still require tap for audio) */
setTimeout(function(){ startPlay(); }, 400);
})();
</script>
