<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>M2A Live TV — Watch Live Channels</title>
<meta name="description" content="Watch live TV channels on M2A Live TV.">
<meta name="theme-color" content="#0b0b0f">
<link rel="icon" href="https://www.marketing2advertising.com/favicon.ico">
<link rel="preconnect" href="https://pagead2.googlesyndication.com">
<link rel="preconnect" href="https://googleads.g.doubleclick.net">
<script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-2269884583846743" crossorigin="anonymous"></script>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth;overflow-x:clip}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Arial,sans-serif;background:#0b0b0f;color:#e8e8ed;line-height:1.55;-webkit-font-smoothing:antialiased}
a{color:#e11d48;text-decoration:none}
img{max-width:100%;height:auto;display:block}
:focus-visible{outline:3px solid #e11d48;outline-offset:2px}

.top-ad-wrap{position:sticky;top:0;z-index:9999;background:#0b0b0f;border-bottom:1px solid rgba(255,255,255,.08);padding:6px 10px 8px}
.top-ad-inner{max-width:1280px;margin:0 auto;text-align:center}
.top-ad-label{font-size:10px;letter-spacing:1.5px;text-transform:uppercase;color:#9a9aa8;margin-bottom:4px;font-weight:700}
.top-ad-box{min-height:90px;background:#121218;border:1px solid rgba(255,255,255,.06);border-radius:12px;overflow:hidden;display:flex;align-items:center;justify-content:center}
ins.adsbygoogle[data-ad-status="unfilled"]{visibility:hidden!important}

.wrap{max-width:1280px;margin:0 auto;padding:16px 14px 40px}
.brand{text-align:center;padding:8px 0 16px}
.brand h1{margin:0;color:#fff;font-size:clamp(26px,4.5vw,40px);font-weight:900;letter-spacing:-.5px}
.brand h1 span{color:#e11d48}
.brand p{margin:6px 0 0;color:#8a8a96;font-size:13px}

.search-wrap{max-width:640px;margin:0 auto 14px}
#search{width:100%;height:46px;border:1px solid rgba(255,255,255,.12);border-radius:14px;background:#16161d;color:#fff;outline:none;padding:0 16px;font-size:16px}
#search:focus{border-color:#e11d48;box-shadow:0 0 0 3px rgba(225,29,72,.18)}

.tabs{display:flex;justify-content:center;flex-wrap:wrap;gap:7px;margin-bottom:16px}
.tab{appearance:none;border:1px solid rgba(255,255,255,.12);background:#16161d;color:#bbb;border-radius:999px;padding:8px 14px;cursor:pointer;font-weight:800;font-size:12px;transition:.15s}
.tab:hover,.tab.active{background:#e11d48;border-color:#e11d48;color:#fff}

.heading{display:flex;align-items:center;justify-content:space-between;margin:0 0 12px}
.heading h2{margin:0;font-size:18px;color:#fff;font-weight:800}
#count{color:#8a8a96;font-size:12px;font-weight:700}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
@media(min-width:900px){.grid{grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:14px}}
.card{background:#14141a;border-radius:14px;border:2px solid rgba(255,255,255,.06);overflow:hidden;text-decoration:none;color:inherit;display:block;transition:transform .18s,border-color .18s}
.card:hover,.card:focus{transform:translateY(-3px);border-color:#e11d48}
.poster{position:relative;aspect-ratio:16/10;background:#1c1c24;overflow:hidden}
.poster img{width:100%;height:100%;object-fit:cover}
.badge{position:absolute;left:7px;top:7px;background:#e11d48;color:#fff;font-size:9px;font-weight:900;padding:3px 7px;border-radius:5px;text-transform:uppercase}
.overlay{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(0,0,0,.35);opacity:0;transition:opacity .18s}
.card:hover .overlay{opacity:1}
.play{width:42px;height:42px;border-radius:50%;background:#e11d48;color:#fff;display:flex;align-items:center;justify-content:center;font-size:16px;font-weight:900}
.info{padding:9px 10px 11px}
.title{color:#fff;font-weight:800;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.meta{margin-top:3px;font-size:11px;color:#8a8a96}
.empty{grid-column:1/-1;text-align:center;padding:40px 16px;color:#8a8a96;font-weight:700;background:#14141a;border-radius:14px;border:1px solid rgba(255,255,255,.06)}

.footer{margin-top:32px;border-top:1px solid rgba(255,255,255,.06);background:#0a0a0d;text-align:center;padding:18px 14px;font-size:12px;color:#a0a0b0}
.footer a{color:#c0c0d0;margin:0 6px}

@media(max-width:600px){.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}}
</style>
</head>
<body>
<div class="top-ad-wrap">
  <div class="top-ad-inner">
    <div class="top-ad-label">Advertisement</div>
    <div class="top-ad-box">
      <ins class="adsbygoogle"
           data-ad-client="ca-pub-2269884583846743"
           data-ad-slot="2115767840"
           data-ad-format="horizontal"
           data-full-width-responsive="true"
           style="display:block;min-height:90px;width:100%"></ins>
    </div>
  </div>
</div>

<div class="wrap">
  <div class="brand">
    <h1>M2A <span>📺</span> Live TV</h1>
    <p>Watch free live TV channels</p>
  </div>

  <div class="search-wrap">
    <input type="search" id="search" placeholder="Search channels…" autocomplete="off" aria-label="Search channels">
  </div>
  <div class="tabs" id="tabs">
    <button class="tab active" data-filter="all" type="button">ALL</button>
    <button class="tab" data-filter="News" type="button">News</button>
    <button class="tab" data-filter="Entertainment" type="button">Entertainment</button>
    <button class="tab" data-filter="Sports" type="button">Sports</button>
    <button class="tab" data-filter="Community" type="button">Community</button>
    <button class="tab" data-filter="Faith" type="button">Faith</button>
  </div>

  <div class="heading"><h2>Live Channels</h2><span id="count"></span></div>
  <div class="grid" id="catalog"></div>
</div>

<footer class="footer">
  <a href="index.html">Home</a>
  <a href="https://www.marketing2advertising.com/p/contact-us.html" target="_blank" rel="noopener">Contact</a>
  <a href="https://www.marketing2advertising.com/p/privacy-policy.html" target="_blank" rel="noopener">Privacy</a>
  <a href="https://www.marketing2advertising.com/p/terms-and-conditions.html" target="_blank" rel="noopener">Terms</a>
  <p style="margin-top:10px;color:#aaa">© Marketing2Advertising. All rights reserved.</p>
</footer>

<script>
(function(){
"use strict";
var CHANNELS = [{"id": "citizentv", "name": "Citizen TV", "category": "News", "color": "e11d48"}, {"id": "salttv", "name": "Salt TV", "category": "Entertainment", "color": "f59e0b"}, {"id": "sparktv", "name": "Spark TV", "category": "Entertainment", "color": "8b5cf6"}, {"id": "bukedde1", "name": "Bukedde 1 TV", "category": "News", "color": "22c55e"}, {"id": "ntv", "name": "NTV Uganda", "category": "News", "color": "3b82f6"}, {"id": "galaxytv", "name": "Galaxy TV", "category": "Entertainment", "color": "ec4899"}, {"id": "bukedde2", "name": "Bukedde 2 TV", "category": "Entertainment", "color": "14b8a6"}, {"id": "sabcnews", "name": "SABC News", "category": "News", "color": "ef4444"}, {"id": "capetowntv", "name": "Cape Town TV", "category": "Community", "color": "f97316"}, {"id": "tshwanetv", "name": "Tshwane TV", "category": "Community", "color": "a855f7"}, {"id": "sowetotv", "name": "Soweto TV", "category": "Community", "color": "06b6d4"}, {"id": "nrgradio", "name": "NRG Radio UG", "category": "Entertainment", "color": "84cc16"}, {"id": "babatv", "name": "Baba TV", "category": "Entertainment", "color": "f43f5e"}, {"id": "sudantv", "name": "Sudan TV", "category": "News", "color": "eab308"}, {"id": "france24", "name": "France 24", "category": "News", "color": "2563eb"}, {"id": "fifaplus", "name": "FIFA+", "category": "Sports", "color": "16a34a"}, {"id": "dw", "name": "DW", "category": "News", "color": "0ea5e9"}, {"id": "ewtn", "name": "EWTN", "category": "Faith", "color": "7c3aed"}, {"id": "ebstv", "name": "EBS TV Ethiopia", "category": "News", "color": "d946ef"}];
var state = {filter:"all", query:""};

function pushAds(){
  document.querySelectorAll("ins.adsbygoogle:not([data-m2a-loaded]):not([data-adsbygoogle-status])").forEach(function(ad){
    if(ad.getBoundingClientRect().width < 10) return;
    ad.setAttribute("data-m2a-loaded","1");
    try{ (window.adsbygoogle = window.adsbygoogle || []).push({}); }catch(e){ ad.removeAttribute("data-m2a-loaded"); }
  });
}
setTimeout(pushAds, 400);

function getFiltered(){
  var q = (state.query || "").toLowerCase().trim();
  return CHANNELS.filter(function(ch){
    if(state.filter !== "all" && ch.category !== state.filter) return false;
    if(!q) return true;
    return (ch.name + " " + ch.category).toLowerCase().indexOf(q) !== -1;
  });
}
function render(){
  var list = getFiltered();
  document.getElementById("count").textContent = list.length + " channels";
  var cat = document.getElementById("catalog");
  if(!list.length){ cat.innerHTML = '<div class="empty">No channels found.</div>'; return; }
  var html = "";
  list.forEach(function(ch, idx){
    var thumb = "https://via.placeholder.com/400x225/" + ch.color + "/ffffff?text=" + encodeURIComponent(ch.name);
    var imgAttrs = idx < 6
      ? 'decoding="async" fetchpriority="high" width="400" height="225"'
      : 'loading="lazy" decoding="async" width="400" height="225"';
    html += '<a class="card" href="' + ch.id + '.html">' +
      '<div class="poster"><img src="' + thumb + '" alt="' + ch.name + '" ' + imgAttrs + '>' +
      '<span class="badge">LIVE</span><div class="overlay"><div class="play">▶</div></div></div>' +
      '<div class="info"><div class="title">' + ch.name + '</div><div class="meta">' + ch.category + '</div></div></a>';
  });
  cat.innerHTML = html;
}

var search = document.getElementById("search");
var st;
search.addEventListener("input", function(){
  clearTimeout(st);
  st = setTimeout(function(){ state.query = search.value || ""; render(); }, 120);
});
document.querySelectorAll("#tabs .tab").forEach(function(tab){
  tab.addEventListener("click", function(){
    document.querySelectorAll("#tabs .tab").forEach(function(t){ t.classList.remove("active"); });
    tab.classList.add("active");
    state.filter = tab.getAttribute("data-filter") || "all";
    render();
  });
});
render();
})();
</script>
</body>
</html>
