# Nginx subdirectory deployment snippet for https://marketing2advertising.com/firimu/
# Include inside your existing server { ... } block without modifying the root site.

# Option A: Proxying to Node/Express backend (recommended for /firimu/api/* + dynamic sitemap.xml)
location ^~ /firimu/ {
    proxy_pass http://127.0.0.1:3000/firimu/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

