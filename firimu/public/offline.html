<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#040714" />
    <title>Offline — M2a Movies (Firimu)</title>
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      body {
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
        background-color: #040714;
        color: #f9f9f9;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        text-align: center;
      }
      .card {
        max-width: 440px;
        width: 100%;
        background-color: #0e111e;
        border: 1px solid rgba(255, 255, 255, 0.12);
        border-radius: 16px;
        padding: 36px 28px;
      }
      .mark {
        width: 56px;
        height: 56px;
        margin: 0 auto 20px;
        border-radius: 14px;
        background: linear-gradient(135deg, #0483ee, #0063e5);
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .mark svg {
        width: 24px;
        height: 24px;
        fill: #ffffff;
      }
      h1 {
        font-size: 22px;
        font-weight: 700;
        margin-bottom: 10px;
        letter-spacing: -0.02em;
      }
      p {
        font-size: 15px;
        line-height: 1.6;
        color: #a4a9b8;
        margin-bottom: 24px;
      }
      .actions {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
        justify-content: center;
      }
      a, button {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-height: 44px;
        padding: 10px 20px;
        border-radius: 8px;
        font-size: 14px;
        font-weight: 600;
        text-decoration: none;
        cursor: pointer;
      }
      .primary {
        border: none;
        background-color: #f9f9f9;
        color: #040714;
      }
      .secondary {
        border: 1px solid rgba(255, 255, 255, 0.2);
        background-color: #040714;
        color: #f9f9f9;
      }
    </style>
  </head>
  <body>
    <main class="card">
      <div class="mark" aria-hidden="true">
        <svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z" /></svg>
      </div>
      <h1>You are currently offline</h1>
      <p>
        Open your 24-hour saved movies inside the app or reconnect to browse new releases.
      </p>
      <div class="actions">
        <a class="primary" href="/firimu/offline">Open Offline Library</a>
        <button class="secondary" type="button" onclick="window.location.reload()">Try Again</button>
      </div>
    </main>
  </body>
</html>
